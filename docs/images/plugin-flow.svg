<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#31302e"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0075de"/>
    </marker>
  </defs>
  <rect width="920" height="700" rx="14" fill="#f6f5f4"/>

  <!-- lane headers -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="20" y="20" width="140" height="44" rx="8" fill="#fff" stroke="#dddddd"/>
    <text x="90" y="40" fill="#31302e">Figma document</text>
    <text x="90" y="55" font-size="9.5" font-weight="400" fill="#a39e98">canvas · selection</text>
    <rect x="260" y="20" width="140" height="44" rx="8" fill="#2c2c2c"/>
    <text x="330" y="40" fill="#fff">Sandbox</text>
    <text x="330" y="55" font-size="9.5" font-weight="400" fill="#bbb">dist/code.js</text>
    <rect x="530" y="20" width="140" height="44" rx="8" fill="rgba(0,117,222,0.08)" stroke="#0075de"/>
    <text x="600" y="40" fill="#005bab">Plugin UI</text>
    <text x="600" y="55" font-size="9.5" font-weight="400" fill="#005bab">dist/ui.html (React)</text>
    <rect x="760" y="20" width="140" height="44" rx="8" fill="#fff" stroke="#dddddd"/>
    <text x="830" y="40" fill="#31302e">Preview iframe</text>
    <text x="830" y="55" font-size="9.5" font-weight="400" fill="#a39e98">srcdoc</text>
  </g>

  <!-- lifelines -->
  <g stroke="#cfcac4" stroke-dasharray="4 4">
    <line x1="90" y1="64" x2="90" y2="600"/>
    <line x1="330" y1="64" x2="330" y2="600"/>
    <line x1="600" y1="64" x2="600" y2="600"/>
    <line x1="830" y1="64" x2="830" y2="600"/>
  </g>

  <g font-size="10.5" fill="#31302e">
    <!-- 1 -->
    <line x1="90" y1="100" x2="327" y2="100" stroke="#31302e" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="100" y="94">① selectionchange · nodechange · page change</text>
    <text x="100" y="116" font-size="9.5" fill="#a39e98">only edits inside the selection · debounce 150ms</text>

    <!-- 2 -->
    <line x1="330" y1="144" x2="597" y2="144" stroke="#0075de" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#r)"/>
    <text x="342" y="138" fill="#005bab">② loading</text>
    <text x="342" y="160" font-size="9.5" fill="#a39e98">runs never overlap; a change mid-run reruns once</text>

    <!-- normalize box -->
    <rect x="150" y="174" width="370" height="128" rx="6" fill="#2c2c2c"/>
    <g font-size="10" fill="#e8e8e8">
      <text x="162" y="192" font-weight="700" fill="#fff">③ normalize — the only module that reads the Figma API</text>
      <text x="162" y="209">countNodes ≤ 3000 layers</text>
      <text x="162" y="225">absoluteTransform · auto layout · sizing · constraints</text>
      <text x="162" y="241">fills / strokes / effects · text segments · variables</text>
      <text x="162" y="257">main component · annotations · vectors → SVG_STRING</text>
      <text x="162" y="273">image fills → getImageByHash bytes (LRU cache of 100)</text>
      <text x="162" y="289">library / image lookups: timeout + backoff → <tspan font-weight="700" fill="#fff">IR</tspan></text>
    </g>

    <!-- generate box -->
    <rect x="150" y="314" width="370" height="96" rx="6" fill="#fff" stroke="#dddddd"/>
    <g font-size="10">
      <text x="162" y="332" font-weight="700">④ generate</text>
      <text x="162" y="349">buildTree → css.ts → generator for the chosen target</text>
      <text x="162" y="365">merged pages (responsive.ts) → previewSizes</text>
      <text x="162" y="381">preview = HTML + CSS, images → goapp-figma-image:&lt;hash&gt;</text>
      <text x="162" y="397">code references images/&lt;file&gt; · warnings collected</text>
    </g>

    <!-- 5 -->
    <line x1="330" y1="440" x2="597" y2="440" stroke="#0075de" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#r)"/>
    <text x="342" y="434" fill="#005bab">⑤ images (bytes, only hashes not sent yet)</text>
    <line x1="330" y1="470" x2="597" y2="470" stroke="#0075de" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#r)"/>
    <text x="342" y="464" fill="#005bab">result: code, previewHtml, warnings + source</text>
    <text x="342" y="486" font-size="9.5" fill="#a39e98">postMessage · source = file, nodes, tags</text>

    <!-- UI box -->
    <rect x="470" y="498" width="260" height="58" rx="6" fill="#fff" stroke="#0075de"/>
    <text x="482" y="516" font-size="10" font-weight="700" fill="#005bab">⑥ render in the window</text>
    <text x="482" y="531" font-size="10">highlight code · estimate tokens</text>
    <text x="482" y="546" font-size="10">placeholders → data URIs (≤ 1600px)</text>

    <!-- 7 -->
    <line x1="600" y1="580" x2="827" y2="580" stroke="#31302e" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="612" y="574">⑦ srcdoc, scaled to fit</text>
    <text x="612" y="596" font-size="9.5" fill="#a39e98">sandboxed, no scripts · Google Fonts only</text>
  </g>

  <!-- bottom notes -->
  <rect x="20" y="614" width="880" height="72" rx="8" fill="#fff" stroke="#dddddd"/>
  <g font-size="10.5" fill="#615d59">
    <text x="34" y="634"><tspan font-weight="700" fill="#31302e">User actions:</tspan> settings → clientStorage · Pages tags → pluginData on the frame → rerun from ③</text>
    <text x="34" y="653"><tspan font-weight="700" fill="#31302e">Export:</tspan> normalize → buildProject → files to the UI → optimizeFiles → zip built and downloaded in the window, no server</text>
    <text x="34" y="672"><tspan font-weight="700" fill="#31302e">Dev Mode:</tspan> figma.codegen "generate" → same normalize + generate → code blocks in Figma's Code panel (no window)</text>
  </g>
</svg>
